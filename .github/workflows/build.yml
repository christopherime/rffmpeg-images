---
name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "brain/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  OWNER: christopherime
  # Bump BOTH together — worker ffmpeg must match brain Jellyfin version.
  JELLYFIN_VERSION: "10.11.11"
  PGSQL_TAG: "10.11.11-1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: rffmpeg-worker
            context: worker
            tag_env: JELLYFIN_VERSION
          - name: jellyfin-pgsql-rffmpeg
            context: brain
            tag_env: PGSQL_TAG
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "value=${{ env[matrix.tag_env] }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
