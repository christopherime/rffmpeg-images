# Hardened sshd for the rffmpeg worker: key-only root login from the
# brain pod. The authorized key should carry a forced-command/restriction
# prefix where practical (see joshuaboniface/rffmpeg docs/HARDENING).
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowUsers root
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PrintMotd no
